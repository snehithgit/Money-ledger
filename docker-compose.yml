services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - FINANCE_DATA_DIR=/data
    volumes:
      - finance_data:/data
    ports:
      - "8000:8000" # direct API access for debugging / API docs at /docs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  finance_data:
    name: finance_tracker_data
