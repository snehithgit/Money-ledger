services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - FINANCE_DATA_DIR=/data
    volumes:
      - finance_data:/data
    ports:
      - "8080:8000" # UI + API, both on this one port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  finance_data:
    name: finance_tracker_data
